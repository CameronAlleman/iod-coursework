<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Calculator Example</title>
  </head>
  <body>
    <div>
      <h1 class="heading">Server Side Calculator</h1>
      <div class="calculatorbody">
        <div class="result">Result:<span id="result"></span></div>
        <div class="input1">
          <label for="num1">Number 1:</label>
          <input type="number" id="num1" placeholder="Enter first number" />
        </div>
        <div class="input2">
          <label for="num2">Number 2:</label>
          <input type="number" id="num2" placeholder="Enter second number" />
        </div>
        <div class="operators">
          <button id="addButton" class="add">Add</button>
          <button id="subButton" class="subtract">Subtract</button>
          <button id="multButton" class="multiply">Multiply</button>
          <button id="divButton" class="divide">Divide</button>
        </div>

        <script>
          //addition

          document
            .getElementById("addButton")
            .addEventListener("click", function () {
              //pull user inputs
              event.preventDefault(); //stop page refresh after submit
              const num1 = document.getElementById("num1").value;
              const num2 = document.getElementById("num2").value;

              fetch(`/calculator/add?num1=${num1}&num2=${num2}`) //fetch logic from server
                .then((response) => response.json())
                .then((data) => {
                  document.getElementById("result").innerText = data.result;
                })
                .catch((error) => {
                  //catch value errors
                  console.error("Error:", error);
                });
            });

          //subtraction

          document
            .getElementById("subButton")
            .addEventListener("click", function () {
              //pull user inputs
              event.preventDefault(); //stop page refresh
              const num1 = document.getElementById("num1").value;
              const num2 = document.getElementById("num2").value;

              fetch(`/calculator/subtract?num1=${num1}&num2=${num2}`) //fetch logic from library
                .then((response) => response.json())
                .then((data) => {
                  document.getElementById("result").innerHTML = data.result;
                })
                .catch((error) => {
                  //catch error
                  console.error("Error:", error);
                });
            });

          //multiply

          document
            .getElementById("multButton")
            .addEventListener("click", function () {
              //pull user inputs
              event.preventDefault();
              const num1 = document.getElementById("num1").value;
              const num2 = document.getElementById("num2").value;

              fetch(`/calculator/multiply?num1=${num1}&num2=${num2}`)
                .then((response) => response.json())
                .then((data) => {
                  document.getElementById("result").innerHTML = data.result;
                })
                .catch((error) => {
                  console.log("Error:", error);
                });
            });

          //divide
          document
            .getElementById("divButton")
            .addEventListener("click", function () {
              // pull user inputs
              event.preventDefault();
              const num1 = document.getElementById("num1").value;
              const num2 = document.getElementById("num2").value;

              fetch(`/calculator/divide?num1=${num1}&num2=${num2}`)
                .then((response) => response.json())
                .then((data) => {
                  document.getElementById("result").innerHTML = data.result;
                })
                .catch((error) => {
                  console.log("error:", error);
                });
            });
        </script>
      </div>
    </div>
  </body>
</html>
