<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bootstrap demo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      </head>
   <body>
        <h1>Bootstrap Cards</h1>       
         <div  id="card-list" class="row row-cols-1 row-cols-md-4 g-4"></div>
        <template id="card-template">

            <div class="card">
                <div class="card-body">
                    <div class="card-title"></div>
                    <div class="card-text"></div>
                </div>        
        </template>
   </body>
   <script>
 fetch('https://jsonplaceholder.typicode.com/posts?_limit=10')
  .then((response) => response.json())
  .then((json) => {
    json.forEach(post => addCard(post));
  });

  function addCard(post) {
           // clone the template
           const template = 
              document.getElementById("card-template").content.cloneNode(true);
           // populate the template
           template.querySelector('.card-title').innerText = post.title;
           template.querySelector('.card-text').innerText = post.body;
           // include the populated template into the page
           document.querySelector('#card-list').appendChild(template);
  }
    </script>
 </html>
