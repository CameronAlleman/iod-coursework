<!DOCTYPE html>
<html>
  <head>
      <style>
          body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e3f2fd;
          }
          .card {
            padding: 10px;
            border: 10px solid tan;
            width: 480px;
            margin: 10px;
          }
          .card-title {
            font-weight: 600;
            font-size: 3em;
            padding: 0 0 10px 0;
            text-align: center;
            
          }
          .card-description {
            display:flex;
            font-weight: 400;
            font-size: 2em;
            text-align:center;
          }
          .card-image {
            height: 200px;
            width: 150px;
            padding: 5px;
          }

          .card-portfolio {
            display:flex;
            flex-direction: row;

          }
      </style>
  </head>
  <body>
      <template id="card-template">
          <div class="card">
            <div class="card-body">
              <div class="card-title"></div>
              <div class="card-portfolio"></div>              
            </div>
          </div>
      </template>

      <template id="image-template">
        <div>
        <div class="card-image-title"></div>
        <img class="card-image" />
        </div>
      </template>
     
      <div id="card-list"></div>
  
      <script>
        function addCard(artist) {
           const cardTemplate = document.getElementById("card-template").content.cloneNode(true);

           cardTemplate.querySelector('.card-title').innerText = artist.name;

          //  cardTemplate.querySelector('.card-image-title').innerText = artist.portfolio[0].title;

          //  cardTemplate.querySelector('.card-image').src = artist.portfolio[0].url;



           artist.portfolio.forEach((image) => {      
            const imageTemplate = document.getElementById('image-template').content.cloneNode(true);
            imageTemplate.querySelector('.card-image-title').innerText = image.title;
            imageTemplate.querySelector('.card-image').src = image.url;
            cardTemplate.querySelector('.card-portfolio').appendChild(imageTemplate);
           })

           document.querySelector('#card-list').appendChild(cardTemplate);
        }
        
     
        const artist = {
          name: "Van Gogh",    
          portfolio:[
              {
                title: "portrait",
                url:"https://collectionapi.metmuseum.org/api/collection/v1/iiif/436532/1671316/main-image"
              },
              
              {
                title: "sky", 
                url:"https://mymodernmet.com/wp/wp-content/uploads/2020/11/White-house-night-van-goh-worldwide-2.jpg"
              },
              {
                title: "sunflowers", 
                url:"https://impressionistarts.com/static/0896e8084d16e474a55f2f4ce343be66/0487f/van-gogh-sunflowers.jpg"
              },
    ]
 }
// addCard(artist);
const artists = [artist, artist, artist];

artists.forEach((artist => addCard(artist)))
     </script> 
  
    </body>
</html>
