<!DOCTYPE html>
<html>
  <head>
      <style>
          body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e3f2fd;
          }
          .card {
            padding: 10px;
            background-color: red;
            border: 2px solid blue;
            border-radius: 5px;
            margin-bottom: 20x;
            width: 20px
          }
          .card-title {
            font-weight: 600;
            font-size: 3em;
            padding: 0 0 10px 0;
          }
          .card-description {
            font-weight: 400;
            font-size: 2em
          }
      </style>
  </head>
  <body>
      <template id="card-template">
          <div class="card">
            <div class="card-body">
              <div class="card-title"></div>
              <div class="card-text"></div>
            </div>
          </div>
      </template>
     
      <div id="card-list"></div>
      <script>
        function addCard(user) {
           // clone the template
           const template = 
              document.getElementById("card-template").content.cloneNode(true);
           // populate the template
           template.querySelector('.card-title').innerText = users.name;
           template.querySelector('.card-text').innerText = users.age;
           // include the populated template into the page
           document.querySelector('#card-list').appendChild(template);
        }
        // addCard('Bob', 'Hello There');
        // addCard('Tim', 'Hello There');
        // addCard('Tom', 'Hello There');
        // addCard('Frank', 'Hello There');
     
    const users = [
        {name: 'Bob', age: 23},
        {name: 'Ashley', age: 23},
        {name: 'Alice', age: 23},
        {name: 'Kobe', age: 23},
    ]
     
    users.forEach((user) => {
        addCard(user.name, user.age);
    });
     
     
     </script> 


  </body>
</html>
